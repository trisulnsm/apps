name: Login Connector

version: 0.2.0

author: trisul

description: 
   short: Connects to login syslog
   long:  |
      The Login connector consumes login syslog messages (ClientId, Ip, source,
      devCode) and uses that to meter IP based network usage per ClientId, per
      login source, and per devCode.

apptype: lua

appresources: mmon.lua login-syslog.lua login-syslog-protocol.lua newcg-clientid.lua newcg-clientsource.lua newcg-clientdevcode.lua HostsXClientId.json HostsXClientSource.json HostsXClientDevcode.json FlowIntfsXClientId.json FlowIntfsXClientSource.json FlowIntfXClientDevcode.json ClientXClientSource.json ClientIdXClientDevcode.json ClientSourceXClientDevcode.json ClientIdXClientSourceXClientDevcode.json FlowtaggerClientId.json FlowtaggerClientSource.json FlowtaggerClientDevcode.json


dependencies:  
